services:
  api:
    build: .
    ports: [ "3000:3000" ]
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    ports: [ "5432:5432" ] # <--- ADD THIS LINE HERE
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes: [ taskdata:/var/lib/postgresql/data ]

volumes:
  taskdata:
